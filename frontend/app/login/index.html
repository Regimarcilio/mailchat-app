<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailChat - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 32px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            margin-bottom: 16px;
        }
        input:focus { border-color: #3b82f6; }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        .primary {
            background: #2563eb;
            color: white;
        }
        .secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            margin-top: 8px;
        }
        .note {
            margin-top: 24px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>MailChat</h1>
        <input type="email" id="email" placeholder="seu@email.com">
        <button class="primary" onclick="login()">Entrar</button>
        <button class="secondary" onclick="randomEmail()">Usar e-mail aleatório</button>
        <div class="note">Modo demo - funciona sem Google OAuth2</div>
    </div>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            if (!email) { alert('Digite um e-mail'); return; }
            
            // Store auth
            localStorage.setItem('mailchat_token', 'demo_' + Date.now());
            localStorage.setItem('mailchat_user_email', email);
            
            // Redirect
            window.location.href = '/';
        }
        
        function randomEmail() {
            const random = Math.random().toString(36).substr(2, 6);
            document.getElementById('email').value = 'user' + random + '@mail.com';
            login();
        }
    </script>
</body>
</html>
