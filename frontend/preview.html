<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MailChat - Preview</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f4f8 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }
        p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
        .note {
            margin-top: 24px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 8px;
            font-size: 12px;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MailChat</h1>
        <p>Cliente de e-mail estilo WhatsApp</p>
        
        <button class="btn btn-primary" onclick="simulateLogin()">
            Entrar com Demo
        </button>
        
        <button class="btn btn-secondary" onclick="useRandomEmail()">
            Usar e-mail aleatório
        </button>
        
        <div class="note">
            <strong>Modo Demo:</strong> Funciona sem configuração de Google.
            Para uso real, configure OAuth2 no .env
        </div>
    </div>

    <script>
        function simulateLogin() {
            const email = 'demo@mail.com';
            localStorage.setItem('mailchat_token', 'demo_' + Date.now());
            localStorage.setItem('mailchat_user_email', email);
            alert('Login simulado!\n\nEmail: ' + email + '\n\nAcesse: http://localhost:3101');
        }
        
        function useRandomEmail() {
            const random = Math.random().toString(36).substr(2, 6);
            const email = 'user' + random + '@mail.com';
            localStorage.setItem('mailchat_token', 'demo_' + Date.now());
            localStorage.setItem('mailchat_user_email', email);
            alert('Email gerado: ' + email);
        }
    </script>
</body>
</html>
